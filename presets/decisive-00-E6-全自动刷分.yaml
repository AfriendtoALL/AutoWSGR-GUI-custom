# 决战 E6 全自动刷分（v6 逻辑）
# 文件名以 00- 开头：GUI 日常任务列表按名称排序，确保它排在“决战第1章”之前，
# 避免打开列表后直接点“加入队列”时默认选中 E1。
#
# 用法 A（手动加入队列）：
#   GUI → 计划管理 / 任务预设 → 刷新 → 选择本文件 → 加入任务队列 → 启动。
#   times 表示完整跑几轮 E6（每轮 3 个小关）。需要连续刷分时把 1 改成 N。
#
# 用法 B（每日自动决战开关）：
#   GUI → 设置 → 自动化 → 自动决战 → 启用 → 决战方案选「系统预设」。
#   系统预设就是内置的 E6；「用户计划」则读取「决战计划（旧）」页面保存的配置。
#   注意：自动决战开关只读「系统预设 / 用户计划」，不会直接读取本 YAML。
#
# 说明：本 YAML 使用 GUI 当前任务预设支持的字段。买船优先级、6-1 A 考文垂、
# 6-2 A 撤退、6-3 J 奇尔沙治、撤退快照、夜战阵型、技能买经验等 v6 行为
# 均由后端 DecisiveConfig 默认值执行；level1/level2 会并入潜艇白名单。

task_type: decisive
chapter: 6
times: 1
use_quick_repair: true

# 主选潜艇（会优先进入购买优先级/编队）
